# Build Aegis APK — pipeline oficial (Aegis como raíz)

name: Build Aegis APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      instrumented:
        description: "Smoke instrumentado: emulador + install + monkey (lento, manual)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------------
  # 1) Backend: sintaxis + contratos (56 tests en verde)
  # ---------------------------------------------------------------------------
  backend-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: node --check (sintaxis de todos los .js)
        run: find backend -name "*.js" -not -path "*/node_modules/*" -print0 | xargs -0 -n1 node --check
      - name: Contratos (node --test)
        run: node --test --test-concurrency=1 tests/*.test.js
        working-directory: backend

  # ---------------------------------------------------------------------------
  # 2) Lint estático: sintaxis .sh, sin console.* en server.js, YAML válido
  # ---------------------------------------------------------------------------
  lint:
    needs: backend-checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: node --check (sintaxis de todos los .js)
        run: find backend -name "*.js" -not -path "*/node_modules/*" -print0 | xargs -0 -n1 node --check
      - name: bash -n (sintaxis de los .sh de backend/ y app/)
        run: find backend app -name "*.sh" -print0 | xargs -0 -n1 bash -n
      - name: "server.js sin console.*"
        run: |
          if grep -nE 'console\.' backend/server.js; then
            echo "::error::server.js no puede usar console.* — usa createLogger (src/core/logger.js)"
            exit 1
          fi
          echo "OK: server.js sin console.*"
      - name: YAML válido de los workflows
        run: |
          python3 - <<'PY'
          import glob, sys
          import yaml
          for f in sorted(glob.glob('.github/workflows/*.yml')):
              yaml.safe_load(open(f, encoding='utf-8'))
              print('OK', f)
          PY

  # ---------------------------------------------------------------------------
  # 3) APK DEBUG
  # ---------------------------------------------------------------------------
  build-debug:
    needs: [backend-checks, lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build Debug APK
        run: gradle assembleDebug
        working-directory: app
      - name: Upload APK debug
        uses: actions/upload-artifact@v4
        with:
          name: aegis-debug
          path: app/app/build/outputs/apk/debug/*.apk
          retention-days: 14

  # ---------------------------------------------------------------------------
  # 4) APK RELEASE firmado
  # ---------------------------------------------------------------------------
  build-release:
    needs: build-debug
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detectar keystore (guard)
        id: ks
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "KEYSTORE_BASE64 presente: se firmará assembleRelease"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Sin secreto KEYSTORE_BASE64 — build-release omitido"
          fi
      - name: Decodificar keystore
        if: steps.ks.outputs.present == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: printf '%s' "$KEYSTORE_BASE64" | base64 -d > app/app/companion-release.keystore
      - name: Set up JDK 17
        if: steps.ks.outputs.present == 'true'
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Android SDK
        if: steps.ks.outputs.present == 'true'
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Setup Gradle
        if: steps.ks.outputs.present == 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build Release APK (firmado)
        if: steps.ks.outputs.present == 'true'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease
        working-directory: app
      - name: Upload APK release
        if: steps.ks.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: aegis-release
          path: app/app/build/outputs/apk/release/*.apk
          retention-days: 30
      - name: Attach APK to GitHub Release
        if: steps.ks.outputs.present == 'true' && startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ github.ref_name }} app/app/build/outputs/apk/release/*.apk --clobber

  # ---------------------------------------------------------------------------
  # 5) SAST
  # ---------------------------------------------------------------------------
  semgrep:
    name: semgrep (SAST)
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Semgrep — p/security-audit
        uses: semgrep/semgrep-action@v1
        with:
          config: p/security-audit
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

  gitleaks:
    name: gitleaks (secret scan)
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------------
  # 6) Smoke instrumentado
  # ---------------------------------------------------------------------------
  instrumented:
    name: instrumented (smoke manual)
    if: github.event_name == 'workflow_dispatch' && inputs.instrumented == true
    needs: build-debug
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run instrumented tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            gradle assembleDebug
            adb install -r app/app/build/outputs/apk/debug/*.apk
            adb shell monkey -p com.aegis.hub --throttle 300 -v 500
            adb uninstall com.aegis.hub || true
