<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<meta name="theme-color" content="#0d0d10"/>
<title>opencode companion — POCO F3</title>
<link rel="stylesheet" href="style.css"/>
</head>
<body>

<!-- App flex-column: safe-area-top evita status bar — arranque controlado exclusivamente por overlay nativo de MainActivity.kt -->
<div id="app" class="app">
  <header class="topbar">
    <button id="btn-hamburger" class="icon-btn" aria-label="Abrir menú" aria-expanded="false">
      <span class="hamburger" aria-hidden="true"><i></i><i></i><i></i></span>
    </button>
    <div class="brand">opencode <b>companion</b></div>
    <div class="topbar-pills">
      <span class="pill"><span id="dot-hub" class="dot"></span> <span id="hub-status">…</span></span>
      <span class="pill"><span id="dot-oc" class="dot"></span> <span id="oc-status">…</span></span>
    </div>
    <div class="spacer"></div>
    <div class="voice-mode-wrap" title="Modo de voz">
      <span class="mode-label" data-mode="push">Texto</span>
      <label class="switch-voice">
        <input type="checkbox" id="voice-mode"/>
        <span class="slider"></span>
      </label>
      <span class="mode-label" data-mode="duplex">Conversación</span>
    </div>
    <select id="agent-select" class="agent-select" title="agent"></select>
  </header>

  <div class="workspace">
    <!-- Drawer: proyectos companion (projects.json) con sesiones asociadas -->
    <aside id="drawer" class="drawer" aria-label="Navegación">
      <div class="drawer-head">
        <div class="drawer-title">Espacio de trabajo</div>
        <!-- New Project: inline form (spec 4) -->
        <button id="btn-new-project" class="btn primary btn-block">+ Nuevo proyecto</button>
        <div id="new-project-form" class="hidden" style="display:grid;gap:8px;border:1px solid var(--border);background:var(--panel2);border-radius:10px;padding:10px;">
          <input id="new-project-name" class="input" placeholder="Nombre (requerido)" maxlength="80"/>
          <textarea id="new-project-desc" class="input" placeholder="Descripción (opcional)" rows="2" maxlength="600" style="resize:vertical;"></textarea>
          <div style="display:flex;gap:8px;">
            <button id="btn-create-project" class="btn primary" style="flex:1;">Crear</button>
            <button id="btn-cancel-project" class="btn" style="flex:1;">Cancelar</button>
          </div>
          <div id="new-project-error" class="muted" style="color:var(--err);font-size:11px;min-height:14px;"></div>
        </div>
        <button id="btn-new-session" class="btn primary btn-block">+ Nuevo chat</button>
        <div class="drawer-search"><input id="session-search" class="input" placeholder="Buscar chats…"/></div>
      </div>
      <div id="drawer-body" class="drawer-body">
        <section class="drawer-section" data-section="projects">
          <button class="section-toggle" data-target="projects-list" aria-expanded="true">
            <span>Proyectos</span>
            <span class="count" id="projects-count">—</span>
            <span class="chevron" aria-hidden="true">⌃</span>
          </button>
          <div id="projects-list" class="section-body"></div>
        </section>
        <section class="drawer-section" data-section="standalone">
          <button class="section-toggle" data-target="standalone-list" aria-expanded="true">
            <span>Chats</span>
            <span class="chevron" aria-hidden="true">⌃</span>
          </button>
          <div id="standalone-list" class="section-body"></div>
        </section>
        <section class="drawer-section" data-section="project-settings">
          <button class="section-toggle" data-target="project-settings-body" aria-expanded="false">
            <span>Proyecto</span>
            <span class="chevron" aria-hidden="true">⌃</span>
          </button>
          <div id="project-settings-body" class="section-body collapsed">
            <div id="project-settings-hint" class="muted" style="padding:6px 8px;font-size:11px;">Selecciona un proyecto para ver ajustes.</div>
            <!-- Skills Tab -->
            <div class="drawer-subsection" style="border:1px solid var(--border);border-radius:8px;padding:8px;background:var(--panel);">
              <div style="font-weight:700;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;justify-content:space-between;">
                <span>Skills</span>
                <button id="btn-add-skill" class="btn" style="padding:4px 8px;font-size:11px;">+ Añadir</button>
              </div>
              <div id="add-skill-form" class="hidden" style="display:grid;gap:6px;margin-top:8px;padding:8px;border:1px solid var(--border);border-radius:8px;background:var(--panel2);">
                <div style="display:flex;gap:6px;">
                  <select id="skill-scope" class="input" style="flex:0.5;"><option value="global">global</option><option value="project">este proyecto</option></select>
                  <input id="skill-name" class="input" placeholder="nombre (ej. mi-skill)" style="flex:1;" maxlength="80"/>
                </div>
                <textarea id="skill-content" class="input" placeholder="Contenido markdown de la skill..." rows="5" style="resize:vertical;"></textarea>
                <div style="display:flex;gap:6px;">
                  <button id="btn-save-skill" class="btn primary" style="flex:1;">Guardar</button>
                  <button id="btn-cancel-skill" class="btn" style="flex:1;">Cancelar</button>
                </div>
                <div id="add-skill-error" class="muted" style="color:var(--err);font-size:11px;min-height:12px;"></div>
              </div>
              <div id="skills-list" style="display:grid;gap:6px;margin-top:8px;"></div>
            </div>
            <!-- Linked Projects -->
            <div class="drawer-subsection" style="border:1px solid var(--border);border-radius:8px;padding:8px;background:var(--panel);margin-top:8px;">
              <div style="font-weight:700;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);">Linked Projects</div>
              <div id="linked-projects-list" style="display:grid;gap:4px;margin-top:6px;"></div>
              <div style="display:flex;gap:6px;margin-top:8px;">
                <select id="linked-project-select" class="input" style="flex:1;"></select>
                <button id="btn-link-project" class="btn" style="padding:6px 10px;">Vincular</button>
              </div>
              <button id="btn-summarize-project" class="btn primary" style="width:100%;margin-top:8px;">Generar resumen del proyecto</button>
              <div id="linked-error" class="muted" style="color:var(--err);font-size:11px;min-height:12px;margin-top:4px;"></div>
            </div>
          </div>
        </section>
      </div>
      <div class="drawer-foot">
        <div class="drawer-foot-title">Sistema</div>
        <div id="sys-info" class="sys-info">cargando…</div>
        <div class="drawer-foot-links">
          <span id="hub-pill-foot" class="chip"></span>
          <span class="muted">/sdcard/projects</span>
        </div>
      </div>
    </aside>
    <button id="drawer-backdrop" class="drawer-backdrop" aria-label="Cerrar menú" tabindex="-1"></button>

    <!-- Main: centro mensajes + barra táctil -->
    <main class="main">
      <!-- Pill flotante SSE: pensando / leyendo / bash -->
      <div id="status-pill" class="status-pill hidden" role="status" aria-live="polite">
        <span class="pill-dot"></span><span id="status-pill-text">Listo</span>
      </div>

      <!-- Project detail view (independent workspace per project) — hidden by default -->
      <div id="project-view" class="project-view hidden">
        <div class="project-view-head">
          <button id="btn-project-back" class="icon-btn" aria-label="Volver al chat" title="Volver">←</button>
          <div class="project-view-title-wrap">
            <div id="project-view-title" class="project-view-title">Proyecto</div>
            <div id="project-view-desc" class="project-view-desc">—</div>
          </div>
          <span id="project-view-count" class="chip"></span>
        </div>
        <div class="project-view-tabs">
          <button class="project-tab active" data-tab="sessions">Sesiones</button>
          <button class="project-tab" data-tab="settings">Ajustes</button>
        </div>
        <div id="project-view-sessions" class="project-view-panel">
          <div id="project-view-sessions-list" class="project-sessions-list"></div>
        </div>
        <div id="project-view-settings" class="project-view-panel hidden">
          <div id="project-view-settings-hint" class="muted" style="padding:6px 8px;font-size:11px;"></div>
          <div class="drawer-subsection" style="border:1px solid var(--border);border-radius:8px;padding:8px;background:var(--panel);margin-top:8px;">
            <div style="font-weight:700;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;justify-content:space-between;">
              <span>Skills</span>
              <button id="btn-project-add-skill" class="btn" style="padding:4px 8px;font-size:11px;">+ Añadir</button>
            </div>
            <div id="project-add-skill-form" class="hidden" style="display:grid;gap:6px;margin-top:8px;padding:8px;border:1px solid var(--border);border-radius:8px;background:var(--panel2);">
              <div style="display:flex;gap:6px;">
                <select id="project-skill-scope" class="input" style="flex:0.5;"><option value="global">global</option><option value="project">este proyecto</option></select>
                <input id="project-skill-name" class="input" placeholder="nombre (ej. mi-skill)" style="flex:1;" maxlength="80"/>
              </div>
              <textarea id="project-skill-content" class="input" placeholder="Contenido markdown de la skill..." rows="5" style="resize:vertical;"></textarea>
              <div style="display:flex;gap:6px;">
                <button id="btn-project-save-skill" class="btn primary" style="flex:1;">Guardar</button>
                <button id="btn-project-cancel-skill" class="btn" style="flex:1;">Cancelar</button>
              </div>
              <div id="project-add-skill-error" class="muted" style="color:var(--err);font-size:11px;min-height:12px;"></div>
            </div>
            <div id="project-skills-list" style="display:grid;gap:6px;margin-top:8px;"></div>
          </div>
          <div class="drawer-subsection" style="border:1px solid var(--border);border-radius:8px;padding:8px;background:var(--panel);margin-top:8px;">
            <div style="font-weight:700;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);">Linked Projects</div>
            <div id="project-linked-projects-list" style="display:grid;gap:4px;margin-top:6px;"></div>
            <div style="display:flex;gap:6px;margin-top:8px;">
              <select id="project-linked-project-select" class="input" style="flex:1;"></select>
              <button id="btn-project-link-project" class="btn" style="padding:6px 10px;">Vincular</button>
            </div>
            <button id="btn-project-summarize" class="btn primary" style="width:100%;margin-top:8px;">Generar resumen del proyecto</button>
            <div id="project-linked-error" class="muted" style="color:var(--err);font-size:11px;min-height:12px;margin-top:4px;"></div>
          </div>
        </div>
        <div class="project-composer">
          <div id="project-chips" class="chips hidden"></div>
          <div class="composer-row">
            <button id="btn-project-attach" class="icon-btn attach-btn" aria-label="Adjuntar">＋</button>
            <div class="input-wrap"><textarea id="project-prompt" rows="1" placeholder="Mensaje para este proyecto…"></textarea></div>
            <button id="btn-project-send" class="btn primary send-btn" aria-label="Enviar">↑</button>
          </div>
        </div>
      </div>

      <div id="msgs" class="msgs"></div>

      <div class="composer">
        <div id="chips" class="chips hidden"></div>
        <div class="composer-row">
          <button id="btn-attach" class="icon-btn attach-btn" aria-label="Adjuntar" title="Adjuntar archivo">＋</button>
          <input id="file-picker" type="file" hidden multiple accept=".jpg,.jpeg,.png,.webp,.mp4,.wav,.mp3,.txt,.cmd,.pdf,.docx,.sh,.py,.js,.ts,.json,.c,.cpp,.java,.go,.rs,.rb,.php,.bat,.ps1,.mjs,.cjs,.html,.css,.md,.yaml,.yml,.xml,.ini,.toml,.log,image/*,video/mp4,audio/*,.mp4,.MOV,.mov" />
          <div class="input-wrap">
            <textarea id="prompt" rows="1" placeholder="Escribe un mensaje…"></textarea>
          </div>
          <button id="btn-send" class="btn primary send-btn" aria-label="Enviar">↑</button>
          <button id="btn-mic" class="icon-btn mic-btn" aria-label="Hablar" title="Hablar">🎙</button>
        </div>
        <div class="composer-meta">
          <span id="stream-status" class="muted"></span>
          <span id="stt-state" class="chip hidden"></span>
        </div>
      </div>
    </main>
  </div>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
