<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aegis Hub — Dashboard</title>
  <style>
    :root {
      --bg: #0f1117;
      --card-bg: #161b22;
      --border: #30363d;
      --text: #c9d1d9;
      --text-muted: #8b949e;
      --accent: #58a6ff;
      --green: #3fb950;
      --red: #f85149;
    }
    body {
      margin: 0;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
    }
    h1, h2, h3 { color: #f0f6fc; margin-top: 0; }
    .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 16px; margin-bottom: 24px; }
    .badge { display: inline-block; padding: 4px 8px; border-radius: 12px; font-size: 12px; font-weight: bold; }
    .badge-ok { background: rgba(63, 185, 80, 0.2); color: var(--green); }
    .badge-down { background: rgba(248, 81, 73, 0.2); color: var(--red); }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; margin-bottom: 24px; }
    .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; padding: 20px; }
    .card h3 { margin-bottom: 12px; border-bottom: 1px solid var(--border); padding-bottom: 8px; font-size: 16px; }
    .stat-row { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 14px; }
    .stat-label { color: var(--text-muted); }
    .stat-val { font-family: monospace; font-weight: 600; }
    .session-list { list-style: none; padding: 0; margin: 0; max-height: 250px; overflow-y: auto; }
    .session-item { padding: 10px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; font-size: 13px; }
    .session-item:last-child { border-bottom: none; }
    .log-box { background: #090d13; border: 1px solid var(--border); border-radius: 6px; padding: 12px; font-family: monospace; font-size: 12px; height: 260px; overflow-y: auto; white-space: pre-wrap; color: #7ee787; }
    .btn { background: #238636; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 13px; }
    .btn:hover { background: #2ea043; }
    .auth-bar { margin-bottom: 20px; display: flex; gap: 8px; align-items: center; }
    .auth-input { background: #0d1117; border: 1px solid var(--border); color: #fff; padding: 8px 12px; border-radius: 6px; flex: 1; max-width: 400px; font-family: monospace; }
  </style>
</head>
<body>
  <div class="header">
    <div>
      <h1>Aegis Hub Dashboard</h1>
      <span style="color: var(--text-muted); font-size: 14px;">Local Autonomous AI Orchestrator</span>
    </div>
    <div>
      <span id="hubStatusBadge" class="badge badge-down">Connecting...</span>
    </div>
  </div>

  <div class="auth-bar">
    <input type="password" id="tokenInput" class="auth-input" placeholder="X-Aegis-Token..." />
    <button class="btn" onclick="saveToken()">Guardar Token</button>
    <button class="btn" style="background: #30363d;" onclick="refreshAll()">Actualizar</button>
  </div>

  <div class="grid">
    <div class="card">
      <h3>Estado del Hub</h3>
      <div class="stat-row"><span class="stat-label">Servidor</span><span class="stat-val" id="valServer">—</span></div>
      <div class="stat-row"><span class="stat-label">Puerto</span><span class="stat-val" id="valPort">—</span></div>
      <div class="stat-row"><span class="stat-label">Uptime</span><span class="stat-val" id="valUptime">—</span></div>
      <div class="stat-row"><span class="stat-label">Memoria Heap</span><span class="stat-val" id="valMem">—</span></div>
      <div class="stat-row"><span class="stat-label">Proyectos</span><span class="stat-val" id="valProjects">—</span></div>
      <div class="stat-row"><span class="stat-label">Proveedor Predeterminado</span><span class="stat-val" id="valProvider">antigravity</span></div>
    </div>

    <div class="card">
      <h3>Sesiones Activas</h3>
      <ul class="session-list" id="sessionsList">
        <li style="color: var(--text-muted); padding: 8px;">Cargando sesiones...</li>
      </ul>
    </div>
  </div>

  <div class="card">
    <h3>Últimos Logs del Hub</h3>
    <div class="log-box" id="logBox">Cargando registros...</div>
  </div>

  <script>
    function getToken() {
      return localStorage.getItem("aegis_token") || "";
    }

    function saveToken() {
      const val = document.getElementById("tokenInput").value.trim();
      localStorage.setItem("aegis_token", val);
      refreshAll();
    }

    async function apiFetch(endpoint) {
      const tok = getToken();
      const headers = tok ? { "X-Aegis-Token": tok } : {};
      const res = await fetch(endpoint, { headers });
      if (!res.ok) throw new Error("HTTP " + res.status);
      return res.json();
    }

    async function loadHealth() {
      try {
        const json = await apiFetch("/api/health");
        if (json && json.ok && json.data) {
          const d = json.data;
          document.getElementById("hubStatusBadge").textContent = "ONLINE (" + d.server + ")";
          document.getElementById("hubStatusBadge").className = "badge badge-ok";
          document.getElementById("valServer").textContent = d.server;
          document.getElementById("valPort").textContent = d.port;
          document.getElementById("valUptime").textContent = d.uptime + "s";
          document.getElementById("valMem").textContent = d.memory ? d.memory.heapUsed : "—";
          document.getElementById("valProjects").textContent = d.projects;
          if (d.adapters) {
            const agy = d.adapters.antigravity === "ok" ? "agy:ok" : "agy:down";
            const oc = d.adapters.opencode === "healthy" ? "oc:ok" : "oc:down";
            document.getElementById("valProvider").textContent = oc + " | " + agy;
          }
        }
      } catch (e) {
        document.getElementById("hubStatusBadge").textContent = "OFFLINE";
        document.getElementById("hubStatusBadge").className = "badge badge-down";
      }
    }

    async function loadSessions() {
      const listEl = document.getElementById("sessionsList");
      try {
        const json = await apiFetch("/api/opencode/sessions");
        const sessions = (json && json.data) || [];
        if (!sessions.length) {
          listEl.innerHTML = '<li style="color:var(--text-muted);padding:8px;">No hay sesiones recientes</li>';
          return;
        }
        listEl.innerHTML = sessions.slice(0, 15).map(s => {
          const title = s.title || s.name || s.id;
          const pin = s.pinned ? "📌 " : "";
          const prov = s.provider || "opencode";
          return '<li class="session-item"><span>' + pin + title + '</span><span class="badge" style="background:#21262d;color:#8b949e">' + prov + '</span></li>';
        }).join('');
      } catch (e) {
        listEl.innerHTML = '<li style="color:var(--red);padding:8px;">Error cargando sesiones (verifique token)</li>';
      }
    }

    async function loadLogs() {
      const logBox = document.getElementById("logBox");
      try {
        const json = await apiFetch("/api/system/logs?lines=40");
        const lines = (json && json.data) || [];
        if (lines.length) {
          logBox.textContent = lines.join("\n");
          logBox.scrollTop = logBox.scrollHeight;
        } else {
          logBox.textContent = "No hay logs disponibles";
        }
      } catch (e) {
        logBox.textContent = "Error cargando logs: " + e.message;
      }
    }

    function refreshAll() {
      loadHealth();
      loadSessions();
      loadLogs();
    }

    document.getElementById("tokenInput").value = getToken();
    refreshAll();
    setInterval(refreshAll, 10000);
  </script>
</body>
</html>
