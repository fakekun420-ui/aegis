# Build Aegis APK — pipeline F4 (backend blindado + APK debug/release + SAST)
#
# Cadena (los jobs encadenados con `needs` se ejecutan en este orden):
#   backend-checks ──► lint ──┬──► build-debug ──► build-release (condicional)
#                             ├──► semgrep   (continue-on-error: ver nota)
#                             └──► gitleaks  (continue-on-error: ver nota)
#   build-debug ──► instrumented (SOLO workflow_dispatch + input `instrumented`)
#
# Notas F4:
#  * Gradle queda FIJADO a 8.9 (AGP 8.7.3) — reproducibilidad, sin `gradle latest`.
#  * semgrep/gitleaks van con `continue-on-error: true` mientras no haya un
#    primer ciclo limpio: no bloquean el build, pero dejan el resultado visible
#    en la pestaña de checks. Se retira la bandera cuando las dos corridras
#    pasen sin hallazgos (acción F4 pendiente de primer ciclo).
#  * `instrumented` es manual-only: un emulador cuesta varios minutos y no debe
#    dispararse en cada push.

name: Build Aegis APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      instrumented:
        description: "Smoke instrumentado: emulador + install + monkey (lento, manual)"
        type: boolean
        default: false

# Principio de mínimo privilegio: los jobs sólo leen el repo.
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # 1) Backend: sintaxis + contratos (idéntico a la F3 — 46 tests en verde)
  # ---------------------------------------------------------------------------
  backend-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: node --check (sintaxis de todos los .js)
        # xargs -n1: fallo si ALGÚN .js no parsea (node --check sale != 0)
        run: find backend -name "*.js" -not -path "*/node_modules/*" -print0 | xargs -0 -n1 node --check
      - name: Contratos (node --test)
        # glob sin comillas: lo expande el shell (portable Node 20+ y local)
        run: node --test tests/*.test.js
        working-directory: backend

  # ---------------------------------------------------------------------------
  # 2) Lint estático (F4): sintaxis .sh, sin console.* en server.js, YAML válido
  # ---------------------------------------------------------------------------
  lint:
    needs: backend-checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: node --check (sintaxis de todos los .js)
        run: find backend -name "*.js" -not -path "*/node_modules/*" -print0 | xargs -0 -n1 node --check
      - name: bash -n (sintaxis de los .sh de backend/ y app/)
        # bash -n (no sh -n): los scripts de este árbol usan bashisms declarados
        # en su shebang. `agents/**` queda FUERA de alcance (árbol aparte, bash-only
        # y no gestionado por esta fase).
        run: find backend app -name "*.sh" -print0 | xargs -0 -n1 bash -n
      - name: "server.js sin console.* (A-7/F4: sólo el logger del hub)"
        run: |
          if grep -nE 'console\.' backend/server.js; then
            echo "::error::server.js no puede usar console.* — usa createLogger (src/core/logger.js)"
            exit 1
          fi
          echo "OK: server.js sin console.*"
      - name: YAML válido de los workflows
        run: |
          python3 - <<'PY'
          import glob, sys
          import yaml
          for f in sorted(glob.glob('.github/workflows/*.yml')):
              yaml.safe_load(open(f, encoding='utf-8'))
              print('OK', f)
          PY

  # ---------------------------------------------------------------------------
  # 3) APK DEBUG (job `build` original, renombrado a `build-debug`)
  # ---------------------------------------------------------------------------
  build-debug:
    needs: [backend-checks, lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          # A-6: Gradle fijado (AGP 8.7.3 -> Gradle 8.9). No hay gradle-wrapper
          # en el repo (backlog), así que el pin se hace aquí para builds
          # reproducibles en vez de gradle latest.
          gradle-version: '8.9'
      - name: Build Debug APK
        run: gradle assembleDebug
        working-directory: app
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aegis-debug
          path: app/app/build/outputs/apk/debug/*.apk
          retention-days: 14

  # ---------------------------------------------------------------------------
  # 4) APK RELEASE firmado — CONDICIONAL: sin secreto, los pasos se omiten
  #    (el job no falla y no intenta firmar con un keystore inexistente).
  # ---------------------------------------------------------------------------
  build-release:
    needs: build-debug
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detectar keystore (guard)
        id: ks
        env:
          # El secreto se pasa por env y NUNCA se imprime en el log
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "KEYSTORE_BASE64 presente: se firmará assembleRelease"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Sin secreto KEYSTORE_BASE64 — build-release omitido (usa el APK debug)"
          fi
      - name: Decodificar keystore
        if: steps.ks.outputs.present == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        # Ruta esperada por app/app/build.gradle.kts: file("companion-release.keystore")
        run: printf '%s' "$KEYSTORE_BASE64" | base64 -d > app/app/companion-release.keystore
      - name: Set up JDK 17
        if: steps.ks.outputs.present == 'true'
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Android SDK
        if: steps.ks.outputs.present == 'true'
        uses: android-actions/setup-android@v3
      - name: Setup Gradle
        if: steps.ks.outputs.present == 'true'
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'
      - name: Build Release APK (firmado)
        if: steps.ks.outputs.present == 'true'
        env:
          # Nombres EXACTOS que lee build.gradle.kts (signingConfigs.release)
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease
        working-directory: app
      - name: Upload APK release
        if: steps.ks.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: aegis-release
          path: app/app/build/outputs/apk/release/*.apk
          retention-days: 30

  # ---------------------------------------------------------------------------
  # 5) SAST — NO bloquean hasta el primer ciclo limpio (continue-on-error)
  # ---------------------------------------------------------------------------
  semgrep:
    name: semgrep (SAST, no bloqueante)
    needs: lint
    runs-on: ubuntu-latest
    continue-on-error: true   # F4: se retira tras el primer ciclo limpio
    steps:
      - uses: actions/checkout@v4
      - name: Semgrep — p/security-audit
        uses: semgrep/semgrep-action@v1
        with:
          config: p/security-audit
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

  gitleaks:
    name: gitleaks (secret scan, no bloqueante)
    needs: lint
    runs-on: ubuntu-latest
    continue-on-error: true   # F4: se retira tras el primer ciclo limpio
    steps:
      - uses: actions/checkout@v4
        with:
          # El secret scan necesita el historial completo
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------------
  # 6) Smoke instrumentado — SOLO manual (workflow_dispatch + input boolean)
  #    Fuentes androidTest (SetupWizardNavigationTest.kt) declaradas manual-only:
  #    este job las deja listas para ejecutar a demanda sin coste por push.
  # ---------------------------------------------------------------------------
  instrumented:
    name: instrumented (smoke manual)
    if: github.event_name == 'workflow_dispatch' && inputs.instrumented == true
    needs: build-debug
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'
      - name: Habilitar KVM (aceleración para el emulador)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emulador + install + monkey (smoke)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            gradle assembleDebug
            adb install -r app/app/build/outputs/apk/debug/*.apk
            adb shell monkey -p com.aegis.hub --throttle 300 -v 500
            adb uninstall com.aegis.hub || true
